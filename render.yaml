services:
  - type: web
    name: groww-mf-facts-only-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.ingest.run
    startCommand: python -m streamlit run src/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
    healthCheckPath: /
